[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcd-jepa"
version = "0.1.0"
description = "Tripartite Conditional Dynamics for Joint Embedding Predictive Architectures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Diren", email = "direncode@users.noreply.github.com"},
]
keywords = ["jepa", "self-supervised learning", "energy-based models", "topological data analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "torchvision",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "einops",
    "tqdm",
]

[project.optional-dependencies]
topology = ["giotto-tda"]
wandb = ["wandb"]
dev = ["pytest", "black", "ruff"]
all = ["giotto-tda", "omegaconf", "wandb"]

[tool.setuptools.packages.find]
include = ["tcd_jepa*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
