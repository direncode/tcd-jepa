[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcd-jepa"
version = "0.1.0"
description = "Tripartite Conditional Dynamics for Joint Embedding Predictive Architectures"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Diren", email = "direncode@users.noreply.github.com"},
]
keywords = ["jepa", "self-supervised learning", "energy-based models", "topological data analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "torchvision",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "einops",
    "tqdm",
    "Pillow",
]

[project.optional-dependencies]
topology = ["giotto-tda"]
wandb = ["wandb"]
dev = ["pytest", "black", "ruff"]
all = ["giotto-tda", "omegaconf", "wandb"]

[tool.setuptools.packages.find]
include = ["tcd_jepa*", "experiments*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — handled by formatter
    "E741",  # ambiguous variable names (common in math-heavy code)
]

[tool.ruff.lint.isort]
known-first-party = ["tcd_jepa", "experiments"]
