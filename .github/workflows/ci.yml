name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Lint check
        run: ruff check .
      - name: Format check
        run: ruff format --check . || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,topology]" 2>/dev/null || pip install torch torchvision numpy scipy pyyaml tqdm pytest hypothesis
      - name: Run tests
        run: python -m pytest tests/ -x -v --tb=short
      - name: Verify test count
        run: |
          COUNT=$(python -m pytest tests/ --co -q 2>/dev/null | tail -1 | grep -oP '\d+' || echo "0")
          echo "Collected $COUNT tests"
          if [ "$COUNT" -lt 150 ]; then
            echo "::warning::Expected 150+ tests, found $COUNT"
          fi

  smoke-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install torch torchvision numpy scipy pyyaml tqdm
      - name: Validate all configs
        run: |
          python -c "
          from tcd_jepa.utils.config import load_config
          from tcd_jepa.utils.config_validation import validate_config
          import glob
          for path in sorted(glob.glob('configs/*.yaml')):
              cfg = load_config(path)
              errors = validate_config(cfg)
              status = 'FAIL' if errors else 'OK'
              print(f'  {path}: {status}')
              for e in errors:
                  print(f'    {e}')
          "
      - name: Smoke test - model forward pass
        run: |
          python -c "
          import torch
          from tcd_jepa.models.tcd_jepa_model import build_tcd_jepa
          model = build_tcd_jepa(img_size=32, patch_size=4, embed_dim=64, depth=2, num_heads=2, predictor_embed_dim=32, predictor_depth=2, predictor_num_heads=2)
          x = torch.randn(2, 3, 32, 32)
          masks_enc = [torch.arange(32).unsqueeze(0).expand(2, -1)]
          masks_pred = [torch.arange(32).unsqueeze(0).expand(2, -1)]
          result = model(x, masks_enc, masks_pred)
          assert not torch.isnan(result['loss']), 'NaN loss in smoke test'
          print(f'Smoke test passed: loss={result[\"loss\"].item():.4f}')
          "
      - name: Smoke test - training guards
        run: |
          python -c "
          import torch
          from tcd_jepa.training.guards import check_loss_health, compute_gradient_stats, LossTracker
          assert check_loss_health(torch.tensor(1.0))
          assert not check_loss_health(torch.tensor(float('nan')))
          assert not check_loss_health(torch.tensor(float('inf')))
          tracker = LossTracker()
          for _ in range(20): tracker.update(1.0)
          assert tracker.update(100.0)  # spike
          print('Training guards smoke test passed')
          "
