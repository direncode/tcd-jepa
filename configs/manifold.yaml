# Latent Ocean TCD-JEPA — Production Demo Configuration
# Entities on S² (radius 4.5) with 384D sentence-transformer fingerprints,
# directed causal links, and tangent-space velocities.
#
# Usage:
#   # Baseline (no TCD)
#   python train_manifold.py --config configs/manifold.yaml --eval
#
#   # TCD-JEPA (topological crystallization)
#   python train_manifold.py --config configs/manifold.yaml --tcd --eval
#
# The --eval flag runs the full Latent Ocean evaluation suite:
#   - Linear probe + k-NN (representation quality)
#   - Causal link prediction (graph structure preservation)
#   - Manifold neighborhood preservation (geometric fidelity)
#   - Latent Ocean KPIs: Clarity, Drift, Opportunity, Risk
#   - TCD topology: H0 attractors, H1 cycles, H2 boundaries

model:
  encoder:
    fingerprint_dim: 384        # all-MiniLM-L6-v2 output
    num_tokens: 64              # entities per window
    coord_dim: 3                # S² Cartesian (x, y, z)
    embed_dim: 192
    depth: 6
    num_heads: 3
    mlp_ratio: 4.0
    use_causal_encoding: true
    use_velocity_encoding: true
    sphere_radius: 4.5
  predictor:
    predictor_embed_dim: 96
    predictor_depth: 4
    num_heads: 3
  ema:
    start: 0.996
    end: 1.0

training:
  epochs: 100               # increased from 50 — let modules learn
  batch_size: 32
  learning_rate: 0.001
  start_lr: 0.0001
  final_lr: 0.0
  weight_decay: 0.05
  final_weight_decay: 0.05
  warmup_epochs: 5
  optimizer: adamw
  checkpoint_freq: 10
  seed: 42
  deterministic: true
  grad_clip_norm: 1.0

data:
  dataset: synthetic_manifold   # or "latent_ocean" with data_dir
  # data_dir: ./data/latent_ocean  # for real Latent Ocean exports
  num_entities: 512             # increased from 256 — richer topology
  num_clusters: 8               # increased from 6 — more structure to discover
  num_tokens: 64
  fingerprint_dim: 384
  causal_link_prob: 0.15
  cross_cluster_prob: 0.03
  sphere_radius: 4.5
  num_samples: 1000             # increased from 500

masking:
  context_ratio: [0.3, 0.5]
  target_ratio: [0.15, 0.3]
  num_context_masks: 4
  num_target_masks: 1
  min_keep: 4
  use_geodesic: true
  sphere_radius: 4.5

tcd:
  use_dynamic_predictor: true
  explore_every: 3              # more frequent exploration
  crystallize_every: 6          # crystallize after 2 exploration cycles
  langevin_steps: 30            # reduced from 50 — faster iteration
  langevin_step_size: 0.01
  persistence_threshold: 0.2    # lower threshold — catch subtler features
  max_modules: 16               # room for more modules with 8 clusters

logging:
  use_wandb: false
  log_dir: ./logs/manifold
