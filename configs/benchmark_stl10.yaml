# STL-10 benchmark with ViT-S/16 at 96px
# STL-10 has 100k unlabeled images for pretraining + 5k train / 8k test labeled.
# Native 96x96 resolution — a natural fit for self-supervised learning benchmarks.
# ~22M params encoder, trains in ~3-4 hours on a single A100.
model:
  encoder:
    img_size: 96
    patch_size: 16
    in_chans: 3
    embed_dim: 384
    depth: 12
    num_heads: 6
    mlp_ratio: 4.0
  predictor:
    predictor_embed_dim: 192
    predictor_depth: 6
    num_heads: 6
  ema:
    start: 0.996
    end: 1.0

training:
  epochs: 300
  batch_size: 256
  learning_rate: 0.001
  start_lr: 0.0001
  final_lr: 0.0
  weight_decay: 0.05
  final_weight_decay: 0.05
  warmup_epochs: 40
  optimizer: adamw
  use_bfloat16: true
  checkpoint_freq: 50
  seed: 42

data:
  dataset: stl10
  img_size: 96
  num_workers: 8
  data_dir: ./data

masking:
  num_enc_masks: 4
  num_pred_masks: 1
  min_keep: 3
  enc_mask_scale: [0.85, 1.0]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]

logging:
  use_wandb: true
  wandb_project: tcd-jepa-benchmarks
  log_dir: ./logs/benchmark_stl10
