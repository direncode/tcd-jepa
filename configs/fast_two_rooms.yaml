# Fast Two Rooms config - tiny model for CPU experiments
model:
  encoder:
    img_size: 32
    patch_size: 4
    in_chans: 3
    embed_dim: 64
    depth: 2
    num_heads: 2
    mlp_ratio: 2.0
  predictor:
    predictor_embed_dim: 32
    predictor_depth: 2
    num_heads: 2
  ema:
    start: 0.996
    end: 1.0

training:
  epochs: 20
  batch_size: 64
  learning_rate: 0.001
  start_lr: 0.0001
  final_lr: 0.0
  weight_decay: 0.05
  final_weight_decay: 0.05
  warmup_epochs: 2
  optimizer: adamw
  use_bfloat16: false
  checkpoint_freq: 50
  seed: 42

data:
  dataset: two_rooms
  img_size: 32
  num_workers: 0
  data_dir: ./data

masking:
  num_enc_masks: 1
  num_pred_masks: 1
  min_keep: 4
  enc_mask_scale: [0.3, 0.6]
  pred_mask_scale: [0.2, 0.5]
  aspect_ratio: [0.75, 1.5]

logging:
  use_wandb: false
  log_dir: ./logs
