# ============================================================================
# TCD-JEPA H100 RunPod Configuration — ViT-Small (Phase 1)
# ============================================================================
# Optimized for: NVIDIA H100 80GB SXM5
# ViT-Small: 300 epochs, batch 512, BF16
# ============================================================================

model:
  encoder:
    img_size: 32
    patch_size: 4
    in_chans: 3
    embed_dim: 384
    depth: 12
    num_heads: 6
    mlp_ratio: 4.0
  predictor:
    predictor_embed_dim: 192
    predictor_depth: 6
    num_heads: 6
  ema:
    start: 0.996
    end: 1.0

training:
  epochs: 300
  batch_size: 512
  learning_rate: 0.0015
  start_lr: 0.0001
  final_lr: 0.000001
  weight_decay: 0.05
  final_weight_decay: 0.4
  warmup_epochs: 30
  optimizer: adamw
  use_bfloat16: true
  grad_clip_norm: 1.0
  checkpoint_freq: 50
  seed: 42

data:
  dataset: cifar10
  img_size: 32
  num_workers: 8
  data_dir: ./data

masking:
  num_enc_masks: 4
  num_pred_masks: 1
  min_keep: 4
  enc_mask_scale: [0.15, 0.2]
  pred_mask_scale: [0.2, 0.4]
  aspect_ratio: [0.75, 1.5]

logging:
  use_wandb: false
  wandb_project: tcd-jepa-h100
  log_dir: ./logs/h100_run
