# ImageNet config — 8x H100 GPUs
# ViT-B/16, 300 epochs, matching I-JEPA paper hyperparameters
# Effective batch: 128 * 8 = 1024

model:
  encoder:
    img_size: 224
    patch_size: 16
    in_chans: 3
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
    drop_path_rate: 0.1
  predictor:
    predictor_embed_dim: 384
    predictor_depth: 12
    num_heads: 12
  ema:
    start: 0.996
    end: 1.0

training:
  epochs: 300
  batch_size: 128          # per GPU — effective 1024
  learning_rate: 0.001     # scaled by effective_batch/256 automatically
  start_lr: 0.00001
  final_lr: 0.000001
  weight_decay: 0.05
  final_weight_decay: 0.4
  warmup_epochs: 40
  optimizer: adamw
  use_bfloat16: true
  grad_clip: 3.0
  checkpoint_freq: 25
  seed: 42
  collapse_weight: 0.01

data:
  dataset: imagenet
  img_size: 224
  num_workers: 12
  data_dir: ./data/imagenet

masking:
  num_enc_masks: 4
  num_pred_masks: 1
  min_keep: 10
  enc_mask_scale: [0.15, 0.2]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]

logging:
  use_wandb: true
  wandb_project: tcd-jepa-imagenet
  log_dir: ./logs/imagenet
