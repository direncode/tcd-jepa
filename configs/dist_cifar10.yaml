# Distributed training config for CIFAR-10 (multi-GPU)
model:
  encoder:
    img_size: 32
    patch_size: 4
    in_chans: 3
    embed_dim: 192
    depth: 6
    num_heads: 3
    mlp_ratio: 4.0
  predictor:
    predictor_embed_dim: 96
    predictor_depth: 4
    num_heads: 3
  ema:
    start: 0.996
    end: 1.0

training:
  epochs: 50
  batch_size: 128
  learning_rate: 0.001
  start_lr: 0.0001
  final_lr: 0.0
  weight_decay: 0.05
  final_weight_decay: 0.05
  warmup_epochs: 5
  optimizer: adamw
  use_bfloat16: false
  checkpoint_freq: 10
  seed: 42
  # Distributed-specific settings
  strategy: ddp
  activation_checkpointing: false
  max_retries: 3
  tcd_weight: 0.1
  langevin_diff_steps: 5
  monitored_barrier_freq: 100
  grad_clip_norm: 1.0
  deterministic: false

data:
  dataset: cifar10
  img_size: 32
  num_workers: 2
  data_dir: ./data

masking:
  num_enc_masks: 4
  num_pred_masks: 1
  min_keep: 4
  enc_mask_scale: [0.15, 0.2]
  pred_mask_scale: [0.2, 0.4]
  aspect_ratio: [0.75, 1.5]

logging:
  use_wandb: false
  wandb_project: tcd-jepa
  log_dir: ./logs
