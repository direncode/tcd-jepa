# Production CIFAR-10 config — 8x H100 GPUs
# Effective batch: 256 * 8 = 2048
# Masking matches I-JEPA paper: large context, small targets
# Training time: ~15 minutes

model:
  encoder:
    img_size: 32
    patch_size: 4
    in_chans: 3
    embed_dim: 192
    depth: 6
    num_heads: 3
    mlp_ratio: 4.0
    drop_path_rate: 0.1
  predictor:
    predictor_embed_dim: 96
    predictor_depth: 4
    num_heads: 3
  ema:
    start: 0.996
    end: 1.0

training:
  epochs: 100
  batch_size: 256          # per GPU
  learning_rate: 0.001     # scaled by effective_batch/256 automatically
  start_lr: 0.00001
  final_lr: 0.000001
  weight_decay: 0.05
  final_weight_decay: 0.05
  warmup_epochs: 10
  optimizer: adamw
  use_bfloat16: true
  grad_clip: 3.0
  checkpoint_freq: 25
  seed: 42
  collapse_weight: 0.01    # VICReg-style collapse prevention

data:
  dataset: cifar10
  img_size: 32
  num_workers: 8
  data_dir: ./data

# I-JEPA masking: encoder sees LARGE context, predicts SMALL targets
# Official I-JEPA: enc_mask_scale=[0.85,1.0] npred=4, pred_mask_scale=[0.15,0.2] nenc=1
# Adapted for 8x8 grid (64 patches): slightly adjusted scales
masking:
  num_enc_masks: 1         # 1 large context block (encoder sees this)
  num_pred_masks: 4        # 4 small target blocks (predictor predicts these)
  min_keep: 4
  enc_mask_scale: [0.85, 1.0]   # context: 85-100% of patches
  pred_mask_scale: [0.15, 0.2]  # targets: 15-20% each
  aspect_ratio: [0.75, 1.5]

logging:
  use_wandb: false
  wandb_project: tcd-jepa-dist
  log_dir: ./logs/dist_cifar10
