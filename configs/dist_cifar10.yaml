# Distributed CIFAR-10 config — 8x H100 GPUs
# Target: ~2 minutes total training time
# Effective batch: 512 * 8 = 4096

model:
  encoder:
    img_size: 32
    patch_size: 4
    in_chans: 3
    embed_dim: 192
    depth: 6
    num_heads: 3
    mlp_ratio: 4.0
  predictor:
    predictor_embed_dim: 96
    predictor_depth: 4
    num_heads: 3
  ema:
    start: 0.996
    end: 1.0

training:
  epochs: 50
  batch_size: 512        # per GPU — effective 4096
  learning_rate: 0.001   # will be scaled by world_size (-> 0.008)
  start_lr: 0.0001
  final_lr: 0.0
  weight_decay: 0.05
  final_weight_decay: 0.05
  warmup_epochs: 5
  optimizer: adamw
  use_bfloat16: true
  grad_clip: 1.0
  checkpoint_freq: 25
  seed: 42

data:
  dataset: cifar10
  img_size: 32
  num_workers: 8
  data_dir: ./data

masking:
  num_enc_masks: 4
  num_pred_masks: 1
  min_keep: 4
  enc_mask_scale: [0.15, 0.2]
  pred_mask_scale: [0.2, 0.4]
  aspect_ratio: [0.75, 1.5]

logging:
  use_wandb: false
  wandb_project: tcd-jepa-dist
  log_dir: ./logs/dist_cifar10
