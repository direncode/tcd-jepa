# ImageNet baseline config — ViT-Base, 300 epochs
# Matches I-JEPA paper settings for fair comparison
#
# Usage:
#   torchrun --nproc_per_node=8 train_distributed.py --config configs/imagenet_base.yaml
#   torchrun --nproc_per_node=8 train_distributed.py --config configs/imagenet_base.yaml --tcd

model:
  encoder:
    img_size: 224
    patch_size: 16
    in_chans: 3
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
  predictor:
    predictor_embed_dim: 384
    predictor_depth: 6
    num_heads: 12
  ema:
    start: 0.996
    end: 1.0

training:
  epochs: 300
  batch_size: 256           # per GPU — effective batch = 256 * num_gpus
  learning_rate: 0.001
  start_lr: 0.0001
  final_lr: 0.0
  weight_decay: 0.05
  final_weight_decay: 0.05
  warmup_epochs: 15
  optimizer: adamw
  use_bfloat16: true        # use bf16 for H100/H200 efficiency
  checkpoint_freq: 25
  seed: 42
  deterministic: false       # disable for ImageNet — too slow with deterministic ops
  grad_clip_norm: 1.0
  # Distributed settings
  strategy: ddp
  activation_checkpointing: false
  max_retries: 3
  monitored_barrier_freq: 500
  # TCD settings (used when --tcd is passed)
  tcd_weight: 0.001          # very low — lesson from CIFAR-10
  langevin_diff_steps: 3

tcd:
  max_explore: 512
  margin: 0.1               # reduced from 1.0 — lesson from CIFAR-10
  energy_shaping_weight: 0.01
  max_modules: 16

data:
  dataset: imagenet
  img_size: 224
  num_workers: 8
  data_dir: /workspace/data/imagenet    # RunPod default workspace path

masking:
  num_enc_masks: 4
  num_pred_masks: 1
  min_keep: 10
  enc_mask_scale: [0.15, 0.2]
  pred_mask_scale: [0.15, 0.25]
  aspect_ratio: [0.75, 1.5]

evaluation:
  enabled: true
  eval_freq: 25              # evaluate every 25 epochs
  linear_probe_epochs: 100
  knn_k: [1, 5, 20]

logging:
  use_wandb: false
  wandb_project: tcd-jepa-imagenet
  log_dir: ./logs/imagenet
